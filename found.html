<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Fund — আছ সাইর ফাউন্ডেশন</title>
<meta name="theme-color" content="#0F3D30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ০১. CSS ভ্যারিয়েবল / থিম সিস্টেম (index.html-এর সাথে অভিন্ন)
   ========================================================= */
:root{
  --emerald-900:#0F3D30; --emerald-800:#12493A; --emerald-700:#175A47;
  --emerald-600:#1B6E54; --emerald-500:#1F8262;
  --gold-600:#B8893A; --gold-500:#C9A24B; --gold-400:#DDBD73; --gold-100:#F6ECD6;

  --bg:#FBF9F4; --bg-elevated:#FFFFFF; --bg-soft:#F3EEE2;
  --surface:#FFFFFF; --surface-2:#F5F1E7;
  --text-primary:#16241E; --text-secondary:#5B6B63; --text-tertiary:#8C978F;
  --border:#E7E1D2;
  --income:#1F8262; --expense:#B4483C; --investment:#3F6FB0; --pending:#B8893A;
  --shadow-sm:0 1px 2px rgba(15,61,48,0.06), 0 1px 1px rgba(15,61,48,0.04);
  --shadow-md:0 8px 24px rgba(15,61,48,0.10);
  --shadow-lg:0 16px 40px rgba(15,61,48,0.16);
  --overlay:rgba(15,30,25,0.45);

  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-pill:999px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --font-latin: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-bn: 'Hind Siliguri', 'Inter', sans-serif;
  --font-ar: 'Amiri', serif;

  --dur-fast: .18s; --dur-med: .32s;
  --ease: cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#0E1E19; --bg-elevated:#132821; --bg-soft:#0B1815;
  --surface:#152C24; --surface-2:#1B342A;
  --text-primary:#F2F6F3; --text-secondary:#A9BAB2; --text-tertiary:#748A80;
  --border:#22392F;
  --income:#4CC499; --expense:#E08477; --investment:#7FA8DE; --pending:#DDBD73;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg:0 20px 48px rgba(0,0,0,0.5);
  --overlay:rgba(0,0,0,0.6);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg); color:var(--text-primary);
  font-family:var(--font-bn); min-height:100vh;
  overscroll-behavior-y:none;
  transition:background var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{ font-family:var(--font-ar); }
button, input, select{ font-family:inherit; }
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{ border:none; background:none; cursor:pointer; color:inherit; }
input, select{ color:var(--text-primary); }
::selection{ background:var(--gold-400); color:var(--emerald-900); }
::-webkit-scrollbar{ width:0; height:0; }

/* =========================================================
   ০২. লেআউট শেল
   ========================================================= */
.app-shell{
  max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  padding-top:var(--safe-top);
  padding-bottom:calc(78px + var(--safe-bottom));
  background:var(--bg);
}
@media (min-width:600px){ .app-shell{ border-inline:1px solid var(--border); } }

/* ---------- টপ বার ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 18px; padding-top:calc(14px + var(--safe-top));
  background:linear-gradient(180deg, var(--bg) 78%, transparent);
  backdrop-filter:blur(10px);
}
.topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.icon-btn{
  position:relative; width:40px; height:40px; border-radius:var(--r-pill);
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); color:var(--text-primary);
  box-shadow:var(--shadow-sm);
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast);
  flex-shrink:0;
}
.icon-btn:active{ transform:scale(.92); background:var(--surface-2); }
.page-title{ font-size:16px; font-weight:700; }
.topbar-actions{ display:flex; align-items:center; gap:6px; }
.badge{
  position:absolute; top:-2px; right:-2px; min-width:17px; height:17px; padding:0 4px;
  border-radius:var(--r-pill); background:var(--expense); color:#fff;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--bg);
}
.avatar{
  width:40px; height:40px; border-radius:var(--r-pill); background:var(--surface-2); overflow:hidden;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
  color:var(--emerald-600); font-weight:700; font-size:14px;
}
.avatar img{ width:100%; height:100%; object-fit:cover; }

.section{ padding:18px 18px 4px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px;}
.section-title{ font-size:15px; font-weight:700; letter-spacing:.2px; }
.section-link{ font-size:12.5px; color:var(--emerald-600); font-weight:600; flex-shrink:0;}
[data-theme="dark"] .section-link{ color:var(--gold-400); }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm); padding:18px;
}
.btn{
  padding:10px 16px; border-radius:var(--r-pill); font-size:13px; font-weight:700;
  background:var(--emerald-700); color:#fff; box-shadow:var(--shadow-sm);
  transition:transform var(--dur-fast) var(--ease); white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn:active{ transform:scale(.95); }
.btn.gold{ background:var(--gold-500); color:var(--emerald-900); }
.btn.outline{ background:transparent; color:var(--emerald-700); border:1.4px solid var(--border); box-shadow:none;}
[data-theme="dark"] .btn.outline{ color:var(--gold-400); }
.btn.sm{ padding:8px 12px; font-size:12px; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.55; pointer-events:none; }
.btn .spinner{
  width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- মূল ফান্ড কার্ড ---------- */
.hero-fund{
  margin:6px 18px 0; padding:24px 20px; border-radius:var(--r-lg);
  background:linear-gradient(135deg, var(--emerald-700), var(--emerald-900));
  color:#F4F1E6; box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}
.hero-fund::after{
  content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,162,75,.28), transparent 70%);
}
.hero-eyebrow{ font-size:12px; opacity:.75; font-weight:500; }
.hero-amount{ font-size:32px; font-weight:800; letter-spacing:-.5px; margin-top:6px; }
.hero-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px;
  position:relative;
}
.hero-item{
  background:rgba(255,255,255,.08); border-radius:14px; padding:10px 10px;
  backdrop-filter:blur(4px);
}
.hero-item .l{ font-size:10.5px; opacity:.75; margin-bottom:3px; }
.hero-item .v{ font-size:13px; font-weight:700; }

/* ---------- ব্রেকডাউন / ডোনাট চার্ট ---------- */
.donut-row{ display:flex; align-items:center; gap:20px; }
.donut-wrap{ position:relative; flex-shrink:0; width:130px; height:130px; }
.donut-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.donut-center .amt{ font-size:14px; font-weight:800; }
.donut-center .lbl{ font-size:10px; color:var(--text-tertiary); }
.legend{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.legend-label{ flex:1; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.legend-val{ font-weight:700; flex-shrink:0; }

/* ---------- চার্ট (লাইন) ---------- */
.chart-tabs{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:var(--r-pill); }
.chart-tab{
  flex:1; text-align:center; padding:6px 0; font-size:11.5px; font-weight:600;
  color:var(--text-secondary); border-radius:var(--r-pill);
  transition:background var(--dur-fast), color var(--dur-fast);
}
.chart-tab.active{ background:var(--emerald-700); color:#fff; }
.chart-wrap{ margin-top:16px; position:relative; }
.chart-svg{ width:100%; height:150px; display:block; }

/* ---------- মাই ফান্ড ---------- */
.myfund-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.myfund-item .label{ font-size:11.5px; color:var(--text-tertiary); margin-bottom:3px;}
.myfund-item .value{ font-size:14.5px; font-weight:700;}
.status-pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:var(--r-pill);
  font-size:11.5px; font-weight:600; background:rgba(31,130,98,.12); color:var(--income);
}
.status-pill.due{ background:rgba(180,72,60,.12); color:var(--expense); }
.status-pill.partial{ background:rgba(184,137,58,.14); color:var(--pending); }
.dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.login-cta{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.login-cta p{ font-size:13px; color:var(--text-secondary); max-width:220px; }

.month-history{ display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px; }
.month-chip{
  flex:0 0 auto; min-width:64px; text-align:center; padding:9px 6px; border-radius:14px;
  background:var(--surface-2); font-size:11px; font-weight:600; color:var(--text-secondary);
  border:1.4px solid transparent;
}
.month-chip.paid{ color:var(--income); border-color:rgba(31,130,98,.3); }
.month-chip.due{ color:var(--expense); border-color:rgba(180,72,60,.3); }
.month-chip.partial{ color:var(--pending); border-color:rgba(184,137,58,.3); }
.month-chip .m{ display:block; margin-bottom:2px; }

/* ---------- ফিল্টার / সার্চ ---------- */
.filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.filter-chip{
  flex:0 0 auto; padding:8px 14px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600;
  background:var(--surface-2); color:var(--text-secondary);
}
.filter-chip.active{ background:var(--emerald-700); color:#fff; }
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-pill); padding:10px 14px; margin-top:10px;
}
.search-box input{ flex:1; border:none; outline:none; background:transparent; font-size:13px; color:var(--text-primary); }
.search-box svg{ color:var(--text-tertiary); flex-shrink:0; }
.date-select{
  margin-top:10px; width:100%; padding:10px 14px; border-radius:14px; border:1px solid var(--border);
  background:var(--surface); font-size:12.5px; font-weight:600; color:var(--text-secondary);
  appearance:none;
}

/* ---------- লেনদেন লিস্ট ---------- */
.tx-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.tx-row:last-child{ border-bottom:none; }
.tx-icon{
  width:38px; height:38px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(31,130,98,.10); color:var(--income);
}
.tx-icon.expense{ background:rgba(180,72,60,.10); color:var(--expense); }
.tx-icon.investment{ background:rgba(63,111,176,.12); color:var(--investment); }
.tx-info{ flex:1; min-width:0; }
.tx-desc{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx-meta{ font-size:11px; color:var(--text-tertiary); margin-top:2px; display:flex; gap:6px; align-items:center;}
.tx-right{ text-align:right; flex-shrink:0; }
.tx-amount{ font-size:13.5px; font-weight:700; color:var(--income); white-space:nowrap; }
.tx-amount.expense{ color:var(--expense); }
.tx-amount.investment{ color:var(--investment); }
.tx-receipt-link{ font-size:10.5px; color:var(--emerald-600); font-weight:600; margin-top:3px; }
[data-theme="dark"] .tx-receipt-link{ color:var(--gold-400); }

/* ---------- ইনভেস্টমেন্ট কার্ড ---------- */
.invest-card{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.invest-card:last-child{ border-bottom:none; }
.invest-icon{
  width:42px; height:42px; border-radius:12px; background:rgba(63,111,176,.12); color:var(--investment);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.invest-info{ flex:1; min-width:0; }
.invest-name{ font-size:13.5px; font-weight:700; }
.invest-sub{ font-size:11.5px; color:var(--text-tertiary); margin-top:2px; }
.invest-right{ text-align:right; }
.invest-value{ font-size:13.5px; font-weight:700; }
.invest-pl{ font-size:11.5px; font-weight:600; margin-top:2px; }
.invest-pl.up{ color:var(--income); }
.invest-pl.down{ color:var(--expense); }
.status-tag{
  display:inline-block; margin-top:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill);
}
.status-tag.active{ background:rgba(31,130,98,.12); color:var(--income); }
.status-tag.completed{ background:rgba(63,111,176,.12); color:var(--investment); }
.status-tag.pending{ background:rgba(184,137,58,.14); color:var(--pending); }

/* ---------- গোল কার্ড ---------- */
.goal-card + .goal-card{ margin-top:12px; }
.goal-top{ display:flex; align-items:center; gap:10px; }
.goal-icon-wrap{
  width:42px; height:42px; border-radius:12px; background:var(--surface-2); color:var(--gold-600);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
[data-theme="dark"] .goal-icon-wrap{ color:var(--gold-400); }
.goal-title-wrap{ flex:1; min-width:0; }
.goal-title{ font-size:14px; font-weight:700; }
.goal-nums{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
.goal-percent{ font-size:13px; font-weight:700; color:var(--emerald-600); }
[data-theme="dark"] .goal-percent{ color:var(--gold-400); }
.progress-track{ height:8px; border-radius:var(--r-pill); background:var(--surface-2); margin-top:12px; overflow:hidden; }
.progress-fill{
  height:100%; border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--gold-500), var(--emerald-600));
  width:0%; transition:width 1s var(--ease);
}
.goal-remaining{ font-size:11px; color:var(--text-tertiary); margin-top:6px; }

/* ---------- স্বচ্ছতা সেকশন ---------- */
.transparency-bar-row{ display:flex; flex-direction:column; gap:12px; }
.tbar-item .top{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; }
.tbar-item .top .name{ color:var(--text-secondary); font-weight:600; }
.tbar-item .top .amt{ font-weight:700; }
.tbar-track{ height:9px; border-radius:var(--r-pill); background:var(--surface-2); overflow:hidden; }
.tbar-fill{ height:100%; border-radius:var(--r-pill); transition:width 1s var(--ease); }

/* ---------- অ্যাডমিন অ্যাকশন বার ---------- */
.action-row{ display:flex; gap:10px; overflow-x:auto; padding:2px 18px 6px; }
.action-btn{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:7px;
  min-width:78px; padding:12px 8px; border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm);
  font-size:11px; font-weight:600; color:var(--text-secondary);
  transition:transform var(--dur-fast) var(--ease);
}
.action-btn:active{ transform:scale(.94); }
.action-btn .ic{
  width:36px; height:36px; border-radius:11px; background:var(--surface-2); color:var(--emerald-600);
  display:flex; align-items:center; justify-content:center;
}
[data-theme="dark"] .action-btn .ic{ color:var(--gold-400); }

/* =========================================================
   স্কেলিটন
   ========================================================= */
.skeleton-overlay{ position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; justify-content:center; }
.skeleton-shell{ width:100%; max-width:520px; padding:18px; }
.sk{ position:relative; overflow:hidden; background:var(--surface-2); border-radius:var(--r-md); }
.sk::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform:translateX(-100%); animation:shimmer 1.4s infinite;
}
[data-theme="dark"] .sk::after{ background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
@keyframes shimmer{ 100%{ transform:translateX(100%); } }
.sk-topbar{ height:40px; border-radius:14px; margin-bottom:18px; }
.sk-hero{ height:170px; margin-bottom:18px; }
.sk-card{ height:150px; margin-bottom:18px; }
.sk-line{ height:14px; border-radius:6px; margin-bottom:10px; }

/* =========================================================
   বটম নেভিগেশন (index.html-এর অভিন্ন)
   ========================================================= */
.bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; }
.bottom-nav-inner{
  width:100%; max-width:520px; display:flex; background:var(--bg-elevated);
  border-top:1px solid var(--border); padding:8px 6px calc(8px + var(--safe-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,.05);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; border-radius:14px; min-height:44px; justify-content:center;
  color:var(--text-tertiary); transition:color var(--dur-fast), transform var(--dur-fast) var(--ease);
}
.nav-item svg{ width:22px; height:22px; }
.nav-item span{ font-size:10.5px; font-weight:600; }
.nav-item.active{ color:var(--emerald-600); }
[data-theme="dark"] .nav-item.active{ color:var(--gold-400); }
.nav-item:active{ transform:scale(.9); }

/* =========================================================
   বটম শিট (মোর মেনু + ফর্ম + রিসিট)
   ========================================================= */
.sheet-backdrop{
  position:fixed; inset:0; background:var(--overlay); z-index:80; opacity:0; pointer-events:none;
  transition:opacity var(--dur-med) var(--ease);
}
.sheet-backdrop.open{ opacity:1; pointer-events:auto; }
.bottom-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90; display:flex; justify-content:center;
  transform:translateY(100%); transition:transform var(--dur-med) var(--ease);
}
.bottom-sheet.open{ transform:translateY(0); }
.sheet-inner{
  width:100%; max-width:520px; max-height:86vh; overflow-y:auto; background:var(--bg-elevated);
  border-radius:24px 24px 0 0; padding:10px 18px calc(20px + var(--safe-bottom)); box-shadow:var(--shadow-lg);
}
.sheet-handle{ width:38px; height:5px; border-radius:var(--r-pill); background:var(--border); margin:6px auto 14px; }
.sheet-title{ font-size:17px; font-weight:700; margin-bottom:14px; }
.sheet-group-label{
  font-size:11px; font-weight:700; color:var(--text-tertiary); letter-spacing:.6px;
  margin:16px 0 8px; text-transform:uppercase;
}
.sheet-group-label:first-of-type{ margin-top:4px; }
.sheet-row{ display:flex; align-items:center; gap:14px; padding:12px 6px; border-radius:14px; min-height:44px; transition:background var(--dur-fast); }
.sheet-row:active{ background:var(--surface-2); }
.sheet-row-icon{
  width:36px; height:36px; border-radius:11px; background:var(--surface-2); color:var(--emerald-600);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
[data-theme="dark"] .sheet-row-icon{ color:var(--gold-400); }
.sheet-row-text{ flex:1; font-size:14px; font-weight:600; }
.sheet-row-chevron{ color:var(--text-tertiary); }
.sheet-row.danger .sheet-row-text{ color:var(--expense); }
.sheet-row.danger .sheet-row-icon{ color:var(--expense); }
.chip-group{ display:flex; gap:8px; flex-wrap:wrap; padding:4px 6px 6px; }
.chip{ padding:9px 15px; border-radius:var(--r-pill); font-size:13px; font-weight:600; background:var(--surface-2); color:var(--text-secondary); border:1.4px solid transparent; }
.chip.active{ background:var(--emerald-700); color:#fff; }

/* --- ফর্ম উপাদান --- */
.form-group{ margin-bottom:14px; }
.form-label{ font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; display:block; }
.form-input, .form-select, .form-textarea{
  width:100%; padding:12px 14px; border-radius:14px; border:1.4px solid var(--border);
  background:var(--surface); font-size:13.5px; color:var(--text-primary); outline:none;
  transition:border-color var(--dur-fast);
}
.form-input:focus, .form-select:focus, .form-textarea:focus{ border-color:var(--emerald-600); }
.form-textarea{ resize:vertical; min-height:70px; }
.form-file{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px;
  border:1.4px dashed var(--border); font-size:12.5px; color:var(--text-tertiary); cursor:pointer;
}
.form-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* --- রিসিট --- */
.receipt-box{
  background:var(--surface); border:1.4px dashed var(--border); border-radius:var(--r-md);
  padding:20px; text-align:center;
}
.receipt-org{ font-size:14px; font-weight:800; color:var(--emerald-700); }
[data-theme="dark"] .receipt-org{ color:var(--gold-400); }
.receipt-sub{ font-size:11px; color:var(--text-tertiary); margin-top:2px; }
.receipt-amount{ font-size:26px; font-weight:800; margin:16px 0 4px; }
.receipt-status{ font-size:12px; color:var(--income); font-weight:700; margin-bottom:16px;}
.receipt-divider{ border-top:1.4px dashed var(--border); margin:14px 0; }
.receipt-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; }
.receipt-row .k{ color:var(--text-tertiary); }
.receipt-row .v{ font-weight:600; }
.receipt-id{ font-size:10.5px; color:var(--text-tertiary); margin-top:10px; letter-spacing:.5px; }

/* --- টোস্ট --- */
.toast{
  position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom)); transform:translate(-50%, 20px);
  background:var(--emerald-900); color:#fff; padding:11px 18px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:200; opacity:0; pointer-events:none;
  transition:all var(--dur-med) var(--ease); max-width:80%; text-align:center;
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }
.toast.success::before{ content:"✓ "; }

.empty-state, .error-state{
  display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 16px;
  color:var(--text-tertiary); gap:10px;
}
.empty-state svg, .error-state svg{ opacity:.55; }
.empty-state p, .error-state p{ font-size:12.5px; }
.error-state .btn{ margin-top:4px; }

.fade-in{ animation:fadeIn var(--dur-med) var(--ease) both; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.slide-up{ animation:slideUp var(--dur-med) var(--ease) both; }
@keyframes slideUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
.scale-in{ animation:scaleIn var(--dur-fast) var(--ease) both; }
@keyframes scaleIn{ from{ opacity:0; transform:scale(.94);} to{ opacity:1; transform:scale(1);} }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
@media (max-width:359px){ .hero-amount{ font-size:27px; } .donut-wrap{ width:110px; height:110px; } }

/* =========================================================
   FIREBASE
   ========================================================= */
const Firebase = {
  app: null,
  auth: null,
  db: null,
  isConfigured(){ const c = APP_CONFIG.firebase; return c.apiKey && !c.apiKey.startsWith('PASTE_'); },
  async init(){
    if(!this.isConfigured() || typeof firebase === 'undefined'){ AppState.firebaseReady = false; return false; }
    try {
      if(!firebase.apps.length){
        this.app = firebase.initializeApp(APP_CONFIG.firebase);
      } else {
        this.app = firebase.app();
      }
      this.auth = firebase.auth();
      this.db = firebase.database();
      AppState.firebaseReady = true;

      this.auth.onAuthStateChanged(user => {
        if(user){
          AppState.user = {
            uid: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            photoURL: user.photoURL,
            role: 'admin' // অ্যাডমিন পারমিশন
          };
          AppState.isLoggedIn = true;
        } else {
          AppState.user = null;
          AppState.isLoggedIn = false;
        }
        renderProfile();
        renderMyFund();
        renderActionRow();
        renderBottomNav();
      });
      return true;
    } catch(e) {
      console.error("Firebase init error:", e);
      return false;
    }
  },
  async saveEntry(type, payload){
    try {
      if(this.db){
        const txRef = this.db.ref('dashboard/transactions').push();
        await txRef.set({ ...payload, id: txRef.key });
        
        // ড্যাশবোর্ড ফান্ড টোটাল আপডেট
        const totalsRef = this.db.ref('dashboard/totals');
        const snap = await totalsRef.once('value');
        let currentTotals = snap.val() || DEMO_DATA.totals;

        if(type === 'income'){
          currentTotals.totalFund = (currentTotals.totalFund || 0) + payload.amount;
          currentTotals.totalCollection = (currentTotals.totalCollection || 0) + payload.amount;
          currentTotals.available = (currentTotals.available || 0) + payload.amount;
        } else if(type === 'expense'){
          currentTotals.totalFund = (currentTotals.totalFund || 0) - payload.amount;
          currentTotals.totalExpense = (currentTotals.totalExpense || 0) + payload.amount;
          currentTotals.available = (currentTotals.available || 0) - payload.amount;
        } else if(type === 'investment'){
          currentTotals.investment = (currentTotals.investment || 0) + payload.amount;
          currentTotals.available = (currentTotals.available || 0) - payload.amount;
        }
        await totalsRef.set(currentTotals);
        return { ok: true };
      }
      return { ok: true };
    } catch(err){
      console.error(err);
      return { ok: false };
    }
  },
  async uploadToCloudinary(file){
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', APP_CONFIG.cloudinary.uploadPreset);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${APP_CONFIG.cloudinary.cloudName}/auto/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      return { url: data.secure_url };
    } catch(e){
      console.warn("Cloudinary upload failed:", e);
      return { url: null };
    }
  }
};

const DB = {
  async loadFundData(){
    try{
      if(AppState.firebaseReady && Firebase.db){
        const snap = await Firebase.db.ref('dashboard').once('value');
        if(snap.exists() && snap.val()){
          const val = snap.val();
          return {
            totals: val.totals || DEMO_DATA.totals,
            breakdown: val.breakdown || DEMO_DATA.breakdown,
            chart: val.chart || DEMO_DATA.chart,
            myFund: val.myFund || DEMO_DATA.myFund,
            transactions: val.transactions ? (Array.isArray(val.transactions) ? val.transactions : Object.values(val.transactions)) : DEMO_DATA.transactions,
            investments: val.investments || DEMO_DATA.investments,
            goals: val.goals ? (Array.isArray(val.goals) ? val.goals : Object.values(val.goals)) : DEMO_DATA.goals
          };
        } else {
          await Firebase.db.ref('dashboard').set(DEMO_DATA);
          return DEMO_DATA;
        }
      }
      return DEMO_DATA;
    }catch(err){
      console.error('DB load error:', err);
      return DEMO_DATA;
    }
  }
};

function renderDonut(){
  const wrap = document.getElementById('donutRow');
  const data = AppState.fund?.breakdown;
  if(!data || data.length === 0){
    wrap.innerHTML = `<div class="empty-state" style="width:100%;"><p>${t('noData')}</p></div>`;
    return;
  }
  const total = data.reduce((s,d)=> s + d.value, 0) || 1;
  const R = 52, C = 2 * Math.PI * R;
  let offset = 0;
  const circles = data.map(d => {
    const frac = d.value / total;
    const dash = frac * C;
    const circle = `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${d.color}" stroke-width="16" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 65 65)" stroke-linecap="butt"/>`;
    offset += dash;
    return circle;
  }).join('');
  wrap.innerHTML = `
    <div class="donut-wrap">
      <svg width="130" height="130" viewBox="0 0 130 130">${circles}</svg>
      <div class="donut-center"><div class="amt">${formatBDT(total)}</div><div class="lbl">${t('totalFund')}</div></div>
    </div>
    <div class="legend">
      ${data.map(d => `
        <div class="legend-item">
          <span class="legend-dot" style="background:${d.color}"></span>
          <span class="legend-label">${t(d.key)}</span>
          <span class="legend-val">${formatBDT(d.value)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderChart(range){
  AppState.chartRange = range;
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  const data = AppState.fund?.chart?.[range];
  const wrap = document.getElementById('chartWrap');
  if(!data || data.length === 0){
    wrap.innerHTML = `<div class="empty-state"><p>${t('noData')}</p></div>`;
    return;
  }
  const w = 300, h = 150, pad = 8;
  const max = Math.max(...data), min = Math.min(...data);
  const range_ = (max - min) || 1;
  const stepX = (w - pad*2) / (data.length - 1 || 1);
  const points = data.map((v,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((v - min) / range_) * (h - pad*2);
    return [x,y];
  });
  const linePath = points.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${points[points.length-1][0].toFixed(1)},${h} L${points[0][0].toFixed(1)},${h} Z`;
  wrap.innerHTML = `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--emerald-600)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--emerald-600)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#areaGrad2)" />
      <path d="${linePath}" fill="none" stroke="var(--emerald-600)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${points[points.length-1][0]}" cy="${points[points.length-1][1]}" r="4" fill="var(--gold-500)" stroke="var(--surface)" stroke-width="2"/>
    </svg>
  `;
}

function renderMyFund(){
  const box = document.getElementById('myFundCard');
  if(!AppState.isLoggedIn){
    box.innerHTML = `
      <div class="login-cta">
        <p>${t('loginPrompt')}</p>
        <button class="btn gold" id="btnLoginInline">${t('loginBtn')}</button>
      </div>`;
    document.getElementById('btnLoginInline').addEventListener('click', ()=> Auth.signInWithGoogle());
    return;
  }
  const mf = AppState.fund?.myFund;
  if(!mf){ box.innerHTML = `<div class="empty-state"><p>${t('noData')}</p></div>`; return; }
  const statusMap = { paid:t('paid'), partial:t('partial'), due:t('due') };
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="status-pill ${mf.status === 'paid' ? '' : mf.status}"><span class="dot"></span>${statusMap[mf.status]}</span>
      <span style="font-size:11.5px;color:var(--text-tertiary);">${t('lastPayment')}: ${mf.lastPayment || '—'}</span>
    </div>
    <div class="myfund-grid">
      <div class="myfund-item"><div class="label">${t('monthlyAmount')}</div><div class="value">${formatBDT(mf.monthly)}</div></div>
      <div class="myfund-item"><div class="label">${t('totalPaid')}</div><div class="value">${formatBDT(mf.totalPaid)}</div></div>
      <div class="myfund-item"><div class="label">${t('totalDue')}</div><div class="value">${formatBDT(mf.totalDue)}</div></div>
      <div class="myfund-item"><div class="label">${t('paymentStatus')}</div><div class="value">${statusMap[mf.status]}</div></div>
    </div>
    <div class="month-history">
      ${(mf.months||[]).map(mo => `<div class="month-chip ${mo.status}"><span class="m">${mo.m}</span>${statusMap[mo.status]}</div>`).join('')}
    </div>
  `;
}

function filterTransactions(){
  let list = AppState.fund?.transactions || [];
  if(AppState.txFilter !== 'all') list = list.filter(tx => tx.type === AppState.txFilter);
  if(AppState.txSearchTerm.trim()){
    const q = AppState.txSearchTerm.trim().toLowerCase();
    list = list.filter(tx => tx.desc.toLowerCase().includes(q));
  }
  return list;
}
function renderTransactions(){
  const box = document.getElementById('txCard');
  const list = filterTransactions();
  if(!list || list.length === 0){
    box.innerHTML = `<div class="empty-state"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><p>${t('noTx')}</p></div>`;
    return;
  }
  const iconMap = {
    income:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 17V7H7"/></svg>',
    expense:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M7 7h10v10"/></svg>',
    investment:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>'
  };
  const signMap = { income:'+', expense:'-', investment:'-' };
  box.innerHTML = list.map((tx,i) => `
    <div class="tx-row">
      <div class="tx-icon ${tx.type}">${iconMap[tx.type]}</div>
      <div class="tx-info">
        <div class="tx-desc">${tx.desc}</div>
        <div class="tx-meta"><span>${tx.date}</span><span>•</span><span>${t('addedBy')}: ${tx.addedBy}</span></div>
      </div>
      <div class="tx-right">
        <div class="tx-amount ${tx.type}">${signMap[tx.type]}${formatBDT(tx.amount)}</div>
        ${tx.hasReceipt ? `<div class="tx-receipt-link" data-receipt-index="${i}" style="cursor:pointer;">${t('viewReceipt')}</div>` : ''}
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-receipt-index]').forEach(el => {
    el.addEventListener('click', ()=>{
      const tx = list[Number(el.dataset.receiptIndex)];
      openReceipt(tx);
    });
  });
}

function renderInvestments(){
  const box = document.getElementById('investCard');
  const list = AppState.fund?.investments;
  if(!list || list.length === 0){
    box.innerHTML = `<div class="empty-state"><p>${t('noInvest')}</p></div>`;
    return;
  }
  box.innerHTML = list.map(inv => {
    const pl = inv.current - inv.initial;
    const plPct = inv.initial ? ((pl/inv.initial)*100).toFixed(1) : '0.0';
    return `
      <div class="invest-card">
        <div class="invest-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg></div>
        <div class="invest-info">
          <div class="invest-name">${inv.name}</div>
          <div class="invest-sub">${t('initialAmount')}: ${formatBDT(inv.initial)} • ${inv.date}</div>
          <span class="status-tag ${inv.status}">${t(inv.status)}</span>
        </div>
        <div class="invest-right">
          <div class="invest-value">${formatBDT(inv.current)}</div>
          ${inv.initial ? `<div class="invest-pl ${pl>=0?'up':'down'}">${pl>=0?'+':''}${plPct}%</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderGoals(){
  const box = document.getElementById('goalList');
  const goals = AppState.fund?.goals;
  if(!goals || goals.length === 0){
    box.innerHTML = `<div class="card empty-state"><p>${t('noGoals')}</p></div>`;
    return;
  }
  const icons = {
    kaaba:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h16"/></svg>',
    plane:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>'
  };
  box.innerHTML = goals.map(g => {
    const pct = Math.min(100, Math.round((g.collected / g.target) * 100));
    return `
      <div class="card goal-card">
        <div class="goal-top">
          <div class="goal-icon-wrap">${icons[g.icon] || icons.kaaba}</div>
          <div class="goal-title-wrap">
            <div class="goal-title">${g.title}</div>
            <div class="goal-nums">${formatBDT(g.collected)} / ${formatBDT(g.target)}</div>
          </div>
          <div class="goal-percent">${pct}%</div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="goal-remaining">${t('remaining')}: ${formatBDT(g.target - g.collected)}</div>
      </div>
    `;
  }).join('');
}

function renderTransparency(){
  const box = document.getElementById('transparencyBars');
  const data = AppState.fund?.breakdown;
  if(!data || data.length === 0){
    box.innerHTML = `<div class="empty-state"><p>${t('noData')}</p></div>`;
    return;
  }
  const total = data.reduce((s,d)=> s + d.value, 0) || 1;
  box.innerHTML = data.map(d => {
    const pct = Math.round((d.value/total)*100);
    return `
      <div class="tbar-item">
        <div class="top"><span class="name">${t(d.key)}</span><span class="amt">${formatBDT(d.value)} (${pct}%)</span></div>
        <div class="tbar-track"><div class="tbar-fill" style="width:${pct}%; background:${d.color};"></div></div>
      </div>
    `;
  }).join('');
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.documentElement.dir = AppState.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = AppState.lang;
}

function renderAll(){
  applyStaticTranslations();
  renderProfile();
  renderHero();
  renderActionRow();
  renderDonut();
  renderChart(AppState.chartRange);
  renderMyFund();
  renderTransactions();
  renderInvestments();
  renderGoals();
  renderTransparency();
  renderBottomNav();
}

/* =========================================================
   NOTIFICATION — টোস্ট
   ========================================================= */
let toastTimer = null;
function showToast(msg, success){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('success', !!success);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
}

/* =========================================================
   বটম শিট নিয়ন্ত্রণ (একাধিক শিটের জন্য জেনেরিক)
   ========================================================= */
function openSheet(sheetId){
  const backdropId = sheetId === 'moreSheet' ? 'sheetBackdrop' : sheetId === 'formSheet' ? 'formBackdrop' : 'receiptBackdrop';
  document.getElementById(backdropId).classList.add('open');
  document.getElementById(sheetId).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet(sheetId){
  const backdropId = sheetId === 'moreSheet' ? 'sheetBackdrop' : sheetId === 'formSheet' ? 'formBackdrop' : 'receiptBackdrop';
  document.getElementById(backdropId).classList.remove('open');
  document.getElementById(sheetId).classList.remove('open');
  document.body.style.overflow = '';
}

/* =========================================================
   অ্যাড এন্ট্রি ফর্ম লজিক
   ========================================================= */
const formTitleMap = { income:'addIncome', expense:'addExpense', payment:'addPayment', investment:'addInvestment' };
function openEntryForm(type){
  AppState.activeFormType = type;
  document.getElementById('formTitle').textContent = t(formTitleMap[type] || 'addIncome');
  document.getElementById('entryForm').reset();
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('fileLabel').textContent = t('uploadFile');
  openSheet('formSheet');
}
async function handleEntrySubmit(e){
  e.preventDefault();
  const btn = document.getElementById('btnSaveEntry');
  const label = document.getElementById('saveBtnLabel');
  const amount = document.getElementById('fAmount').value;
  if(!amount || Number(amount) <= 0){ showToast(t('noData')); return; }

  btn.disabled = true;
  label.textContent = t('saving');
  btn.insertAdjacentHTML('afterbegin', '<span class="spinner"></span>');

  const file = document.getElementById('fAttachment').files[0];
  let attachmentUrl = null;
  if(file){
    const res = await Firebase.uploadToCloudinary(file);
    attachmentUrl = res.url;
  }

  const payload = {
    type: AppState.activeFormType,
    amount: Number(amount),
    category: document.getElementById('fCategory').value,
    description: document.getElementById('fDesc').value,
    date: document.getElementById('fDate').value,
    attachmentUrl,
    createdBy: AppState.user?.name || 'admin'
  };

  await Firebase.saveEntry(AppState.activeFormType, payload);

  btn.disabled = false;
  label.textContent = t('save');
  const spinner = btn.querySelector('.spinner');
  if(spinner) spinner.remove();

  closeSheet('formSheet');
  showToast(t('saveSuccess'), true);
}

/* =========================================================
   রিসিট লজিক
   ========================================================= */
function openReceipt(tx){
  AppState.activeReceipt = tx;
  const box = document.getElementById('receiptBox');
  box.innerHTML = `
    <div class="receipt-org">${t('foundationName')}</div>
    <div class="receipt-sub">${AppState.user?.name || t('memberName')}</div>
    <div class="receipt-amount">${formatBDT(tx.amount)}</div>
    <div class="receipt-status">${t('paid')}</div>
    <div class="receipt-divider"></div>
    <div class="receipt-row"><span class="k">${t('description')}</span><span class="v">${tx.desc}</span></div>
    <div class="receipt-row"><span class="k">${t('date')}</span><span class="v">${tx.date}</span></div>
    <div class="receipt-row"><span class="k">${t('addedBy')}</span><span class="v">${tx.addedBy}</span></div>
    <div class="receipt-id">${t('receiptId')}: ${tx.receiptId || '—'}</div>
  `;
  openSheet('receiptSheet');
}

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents(){
  document.getElementById('sheetBackdrop').addEventListener('click', ()=> closeSheet('moreSheet'));
  document.getElementById('formBackdrop').addEventListener('click', ()=> closeSheet('formSheet'));
  document.getElementById('receiptBackdrop').addEventListener('click', ()=> closeSheet('receiptSheet'));

  document.getElementById('btnNotification').addEventListener('click', ()=>{ window.location.href = 'notifications.html'; });
  document.getElementById('btnProfile').addEventListener('click', ()=>{
    if(AppState.isLoggedIn) window.location.href = 'profile.html';
    else Auth.signInWithGoogle();
  });

  document.getElementById('chartTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chart-tab');
    if(!btn) return;
    renderChart(btn.dataset.range);
  });

  document.getElementById('txTypeFilter').addEventListener('click', (e)=>{
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    document.querySelectorAll('#txTypeFilter .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
    AppState.txFilter = chip.dataset.filter;
    renderTransactions();
  });
  document.getElementById('txSearch').addEventListener('input', (e)=>{
    AppState.txSearchTerm = e.target.value;
    renderTransactions();
  });
  document.getElementById('dateFilter').addEventListener('change', (e)=>{
    AppState.dateFilter = e.target.value;
    // TODO(পরবর্তী ধাপ): Firebase query date range অনুযায়ী refine করা হবে
    renderTransactions();
  });

  document.getElementById('langChips').addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    AppState.lang = chip.dataset.lang;
    localStorage.setItem('assair_lang', AppState.lang);
    document.querySelectorAll('#langChips .chip').forEach(c => c.classList.toggle('active', c === chip));
    renderAll();
  });
  document.getElementById('themeChips').addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    Theme.apply(chip.dataset.themeChoice);
  });
  document.getElementById('btnLogout').addEventListener('click', Auth.logout);

  document.getElementById('entryForm').addEventListener('submit', handleEntrySubmit);
  document.getElementById('fAttachment').addEventListener('change', (e)=>{
    const f = e.target.files[0];
    document.getElementById('fileLabel').textContent = f ? f.name : t('uploadFile');
  });

  document.getElementById('btnPrintReceipt').addEventListener('click', ()=> window.print());
  document.getElementById('btnDownloadReceipt').addEventListener('click', ()=>{
    // TODO(পরবর্তী ধাপ): jsPDF বা অনুরূপ লাইব্রেরি দিয়ে PDF generate architecture
    showToast(AppState.lang === 'bn' ? 'PDF জেনারেশন শীঘ্রই যুক্ত হবে' : 'PDF generation coming soon');
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ closeSheet('moreSheet'); closeSheet('formSheet'); closeSheet('receiptSheet'); }
  });
}

/* =========================================================
   INIT
   ========================================================= */
async function initApp(){
  bindEvents();
  Theme.init();

  document.querySelectorAll('#langChips .chip').forEach(c => c.classList.toggle('active', c.dataset.lang === AppState.lang));

  await Firebase.init();
  const data = await DB.loadFundData();

  if(data){ AppState.fund = data; }
  else{ AppState.fund = null; showToast(t('connError')); }

  renderAll();

  const skeleton = document.getElementById('skeletonOverlay');
  const shell = document.getElementById('appShell');
  setTimeout(()=>{
    skeleton.style.opacity = '0';
    skeleton.style.transition = 'opacity .35s ease';
    shell.style.display = 'block';
    shell.classList.add('fade-in');
    setTimeout(()=> skeleton.style.display = 'none', 380);
  }, 450);
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
