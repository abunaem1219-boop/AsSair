<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>সদস্য তালিকা — আছ সাইর ফাউন্ডেশন</title>
<meta name="theme-color" content="#0F3D30">

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* =========================================================
   ০১. CSS ভ্যারিয়েবল / থিম সিস্টেম (Design Tokens)
   ========================================================= */
:root{
  --emerald-900:#0F3D30;
  --emerald-800:#12493A;
  --emerald-700:#175A47;
  --emerald-600:#1B6E54;
  --emerald-500:#1F8262;
  --gold-600:#B8893A;
  --gold-500:#C9A24B;
  --gold-400:#DDBD73;
  --gold-100:#F6ECD6;

  /* লাইট থিম */
  --bg:#FBF9F4;
  --bg-elevated:#FFFFFF;
  --bg-soft:#F3EEE2;
  --surface:#FFFFFF;
  --surface-2:#F5F1E7;
  --text-primary:#16241E;
  --text-secondary:#5B6B63;
  --text-tertiary:#8C978F;
  --border:#E7E1D2;
  --income:#1F8262;
  --expense:#B4483C;
  --shadow-sm:0 1px 2px rgba(15,61,48,0.06), 0 1px 1px rgba(15,61,48,0.04);
  --shadow-md:0 8px 24px rgba(15,61,48,0.10);
  --shadow-lg:0 16px 40px rgba(15,61,48,0.16);
  --overlay:rgba(15,30,25,0.45);

  --r-sm:12px;
  --r-md:18px;
  --r-lg:24px;
  --r-pill:999px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --font-latin: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-bn: 'Hind Siliguri', 'Inter', sans-serif;
  --font-ar: 'Amiri', serif;

  --dur-fast: .18s;
  --dur-med: .32s;
  --ease: cubic-bezier(.22,.61,.36,1);
}

[data-theme="dark"]{
  --bg:#0E1E19;
  --bg-elevated:#132821;
  --bg-soft:#0B1815;
  --surface:#152C24;
  --surface-2:#1B342A;
  --text-primary:#F2F6F3;
  --text-secondary:#A9BAB2;
  --text-tertiary:#748A80;
  --border:#22392F;
  --income:#4CC499;
  --expense:#E08477;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg:0 20px 48px rgba(0,0,0,0.5);
  --overlay:rgba(0,0,0,0.6);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-bn);
  min-height:100vh;
  overscroll-behavior-y:none;
  transition:background var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{ font-family:var(--font-ar); }
button, input, select{ font-family:inherit; }
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{ border:none; background:none; cursor:pointer; color:inherit; }
::selection{ background:var(--gold-400); color:var(--emerald-900); }
::-webkit-scrollbar{ width:0; height:0; }

/* =========================================================
   ০২. লেআউট শেল ও হেডার
   ========================================================= */
.app-shell{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-top:var(--safe-top);
  padding-bottom:calc(78px + var(--safe-bottom));
  background:var(--bg);
}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  padding:14px 18px;
  background:linear-gradient(180deg, var(--bg) 85%, transparent);
  backdrop-filter:blur(10px);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-icon{
  width:40px; height:40px; border-radius:12px;
  background:linear-gradient(145deg, var(--emerald-600), var(--emerald-900));
  display:flex; align-items:center; justify-content:center;
  color:var(--gold-400); flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.brand-title{ font-weight:700; font-size:18px; line-height:1.2; }
.brand-tag{ font-size:11.5px; color:var(--text-tertiary); }

.topbar-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  position:relative;
  width:40px; height:40px; border-radius:var(--r-pill);
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); color:var(--text-primary);
  box-shadow:var(--shadow-sm);
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.icon-btn:active{ transform:scale(.92); background:var(--surface-2); }
.badge{
  position:absolute; top:-2px; right:-2px;
  min-width:17px; height:17px; padding:0 4px;
  border-radius:var(--r-pill);
  background:var(--expense); color:#fff;
  font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--bg);
}

/* =========================================================
   ০৩. সার্চ ও ফিল্টার বার
   ========================================================= */
.filter-section{ padding:8px 18px 14px; position:sticky; top:68px; z-index:30; background:var(--bg); }
.search-box{
  position:relative; display:flex; align-items:center;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--r-pill); padding:0 14px;
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur-fast);
}
.search-box:focus-within{ border-color:var(--emerald-600); }
.search-icon{ color:var(--text-tertiary); margin-right:8px; display:flex; align-items:center; }
html[dir="rtl"] .search-icon{ margin-right:0; margin-left:8px; }
.search-input{
  width:100%; height:44px; border:none; background:transparent;
  font-size:13.5px; color:var(--text-primary); outline:none;
}
.search-clear{ color:var(--text-tertiary); cursor:pointer; display:none; padding:4px; }

/* অনুভূমিক স্ক্রল ফিল্টার চিপস */
.chips-row{
  display:flex; gap:8px; overflow-x:auto; margin-top:10px;
  padding-bottom:4px; scrollbar-width:none;
}
.filter-chip{
  flex:0 0 auto; padding:6px 14px; border-radius:var(--r-pill);
  font-size:12px; font-weight:600; background:var(--surface);
  border:1px solid var(--border); color:var(--text-secondary);
  transition:all var(--dur-fast); cursor:pointer;
}
.filter-chip.active{
  background:var(--emerald-700); color:#fff; border-color:var(--emerald-700);
}
[data-theme="dark"] .filter-chip.active{ background:var(--gold-500); color:var(--emerald-900); border-color:var(--gold-500); }

/* মেম্বার পরিসংখ্যান কাউন্ট */
.member-count-bar{
  display:flex; justify-content:space-between; align-items:center;
  padding:4px 18px 8px; font-size:12px; color:var(--text-tertiary); font-weight:600;
}

/* =========================================================
   ০৪. মেম্বার গ্রিড / কার্ড লিস্ট
   ========================================================= */
.member-list{ padding:0 18px 20px; display:flex; flex-direction:column; gap:10px; }

.member-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-md); padding:14px;
  display:flex; align-items:center; gap:12px;
  box-shadow:var(--shadow-sm); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast);
  position:relative; overflow:hidden;
}
.member-card:active{ transform:scale(0.98); }

.avatar-wrap{ position:relative; width:48px; height:48px; flex-shrink:0; }
.member-avatar{
  width:100%; height:100%; border-radius:var(--r-pill);
  background:var(--surface-2); object-fit:cover;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:16px; color:var(--emerald-700);
  border:2px solid var(--border);
}
[data-theme="dark"] .member-avatar{ color:var(--gold-400); }
.status-indicator{
  position:absolute; bottom:1px; right:1px;
  width:12px; height:12px; border-radius:50%;
  border:2px solid var(--surface); background:#8C978F;
}
.status-indicator.online{ background:var(--income); }
.status-indicator.offline{ background:#B4483C; }

.member-info{ flex:1; min-width:0; }
.member-name-row{ display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.member-name{ font-size:14px; font-weight:700; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.role-badge{
  font-size:9.5px; font-weight:700; padding:1.5px 6px; border-radius:var(--r-pill);
  text-transform:uppercase; letter-spacing:0.3px;
}
.role-admin{ background:rgba(201,162,75,0.2); color:var(--gold-600); }
.role-moderator{ background:rgba(31,130,98,0.15); color:var(--emerald-600); }
.role-member{ display:none; }

.member-details-row{
  display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--text-secondary);
}
.member-id{ font-weight:600; color:var(--text-tertiary); font-family:var(--font-latin); }
.member-class{
  background:var(--surface-2); padding:1px 6px; border-radius:4px;
  font-weight:500; font-size:11px;
}
.member-location{ display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* কার্ডের অ্যাকশন অ্যারো */
.card-chevron{ color:var(--text-tertiary); flex-shrink:0; }
html[dir="rtl"] .card-chevron{ transform:rotate(180deg); }

/* =========================================================
   ০৫. ফ্লোটিং অ্যাকশন বাটন (FAB - Admin Only)
   ========================================================= */
.fab-btn{
  position:fixed; right:20px; bottom:calc(85px + var(--safe-bottom));
  width:52px; height:52px; border-radius:var(--r-pill);
  background:linear-gradient(135deg, var(--emerald-600), var(--emerald-900));
  color:#fff; display:none; align-items:center; justify-content:center;
  box-shadow:var(--shadow-lg); z-index:45; cursor:pointer;
  transition:transform var(--dur-fast) var(--ease);
}
html[dir="rtl"] .fab-btn{ right:auto; left:20px; }
.fab-btn:active{ transform:scale(0.92); }

/* =========================================================
   ০৬. মেম্বার প্রোফাইল বটম শিট / ফুল-ভিউ
   ========================================================= */
.sheet-backdrop{
  position:fixed; inset:0; background:var(--overlay);
  z-index:80; opacity:0; pointer-events:none;
  transition:opacity var(--dur-med) var(--ease);
}
.sheet-backdrop.open{ opacity:1; pointer-events:auto; }

.bottom-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:90;
  display:flex; justify-content:center;
  transform:translateY(100%);
  transition:transform var(--dur-med) var(--ease);
}
.bottom-sheet.open{ transform:translateY(0); }

.profile-sheet-inner{
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  background:var(--bg-elevated); border-radius:28px 28px 0 0;
  padding:12px 20px calc(24px + var(--safe-bottom));
  box-shadow:var(--shadow-lg);
}
.sheet-handle{
  width:38px; height:5px; border-radius:var(--r-pill);
  background:var(--border); margin:4px auto 14px;
}

/* প্রোফাইল হেডার */
.profile-card-top{
  text-align:center; padding:10px 0 16px; position:relative;
  border-bottom:1px solid var(--border);
}
.profile-avatar-lg{
  width:84px; height:84px; border-radius:var(--r-pill);
  margin:0 auto 10px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; font-weight:700; color:var(--emerald-600);
  border:3px solid var(--emerald-600); object-fit:cover;
  box-shadow:var(--shadow-md);
}
.profile-name-lg{ font-size:18px; font-weight:700; margin-bottom:2px; }
.profile-id-badge{
  display:inline-block; font-size:12px; font-weight:700;
  color:var(--emerald-600); background:rgba(31,130,98,0.12);
  padding:2px 10px; border-radius:var(--r-pill); margin-bottom:6px;
  font-family:var(--font-latin);
}
[data-theme="dark"] .profile-id-badge{ color:var(--gold-400); background:rgba(201,162,75,0.15); }
.profile-status-text{ font-size:11.5px; color:var(--text-tertiary); display:flex; align-items:center; justify-content:center; gap:5px; }

/* প্রোফাইল গ্রিড ফিল্ডস */
.profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px 0; border-bottom:1px solid var(--border); }
.p-field .p-label{ font-size:11px; color:var(--text-tertiary); font-weight:600; margin-bottom:2px; }
.p-field .p-val{ font-size:13.5px; font-weight:700; color:var(--text-primary); }

/* প্রাইভেট ফান্ড সেকশন (শুধু নিজে ও অ্যাডমিন দেখতে পারবে) */
.private-fund-box{
  background:var(--surface-2); border-radius:var(--r-md);
  padding:14px; margin:16px 0; border:1px dashed var(--border);
}
.pf-title{ font-size:12.5px; font-weight:700; color:var(--emerald-700); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
[data-theme="dark"] .pf-title{ color:var(--gold-400); }
.pf-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; }
.pf-item{ background:var(--surface); padding:8px 4px; border-radius:var(--r-sm); border:1px solid var(--border); }
.pf-item .label{ font-size:10px; color:var(--text-tertiary); margin-bottom:2px; }
.pf-item .val{ font-size:12.5px; font-weight:700; }

/* অ্যাকশন বাটনস (কল, এসএমএস, এডিট) */
.profile-actions{ display:flex; gap:10px; margin-top:16px; }
.btn{
  flex:1; padding:11px 16px; border-radius:var(--r-pill);
  font-size:13px; font-weight:700; text-align:center;
  background:var(--emerald-700); color:#fff; display:inline-flex;
  align-items:center; justify-content:center; gap:8px;
  box-shadow:var(--shadow-sm); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease);
}
.btn:active{ transform:scale(0.96); }
.btn.gold{ background:var(--gold-500); color:var(--emerald-900); }
.btn.outline{ background:transparent; color:var(--emerald-700); border:1.5px solid var(--border); box-shadow:none; }
[data-theme="dark"] .btn.outline{ color:var(--gold-400); }
.btn.danger{ background:rgba(180,72,60,0.12); color:var(--expense); border:none; }

/* =========================================================
   ০৭. অ্যাডমিন মেম্বার ফর্ম / ক্লাস ম্যানেজমেন্ট মডাল
   ========================================================= */
.modal-backdrop{
  position:fixed; inset:0; background:var(--overlay);
  z-index:150; opacity:0; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  padding:16px; backdrop-filter:blur(6px);
  transition:opacity var(--dur-med) var(--ease);
}
.modal-backdrop.open{ opacity:1; pointer-events:auto; }

.modal-dialog{
  background:var(--bg-elevated); width:100%; max-width:440px;
  max-height:90vh; overflow-y:auto; border-radius:var(--r-lg);
  padding:20px; box-shadow:var(--shadow-lg); border:1px solid var(--border);
  transform:scale(0.94) translateY(10px);
  transition:transform var(--dur-med) var(--ease);
}
.modal-backdrop.open .modal-dialog{ transform:scale(1) translateY(0); }

.modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-title{ font-size:16px; font-weight:700; }
.modal-close{ font-size:24px; line-height:1; color:var(--text-tertiary); cursor:pointer; }

.form-group{ margin-bottom:12px; }
.form-group label{ display:block; font-size:11.5px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
.form-group input, .form-group select{
  width:100%; padding:10px 14px; border-radius:var(--r-sm);
  border:1.4px solid var(--border); background:var(--surface);
  color:var(--text-primary); font-size:13px; outline:none;
}
.form-group input:focus, .form-group select:focus{ border-color:var(--emerald-600); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* =========================================================
   ০৮. স্কেলিটন ও খালি অবস্থা (Empty State)
   ========================================================= */
.skeleton-overlay{
  position:fixed; inset:0; z-index:999;
  background:var(--bg); display:flex; justify-content:center;
}
.skeleton-shell{ width:100%; max-width:520px; padding:18px; }
.sk{ position:relative; overflow:hidden; background:var(--surface-2); border-radius:var(--r-md); }
.sk::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform:translateX(-100%); animation:shimmer 1.4s infinite;
}
[data-theme="dark"] .sk::after{ background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
@keyframes shimmer{ 100%{ transform:translateX(100%); } }

.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:40px 16px; color:var(--text-tertiary); gap:12px;
}
.empty-state svg{ opacity:0.4; }

/* বটম নেভ */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; justify-content:center;
}
.bottom-nav-inner{
  width:100%; max-width:520px; display:flex;
  background:var(--bg-elevated); border-top:1px solid var(--border);
  padding:8px 6px calc(8px + var(--safe-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,.05);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; border-radius:14px; min-height:44px; justify-content:center;
  color:var(--text-tertiary); transition:color var(--dur-fast), transform var(--dur-fast) var(--ease);
}
.nav-item svg{ width:22px; height:22px; }
.nav-item span{ font-size:10.5px; font-weight:600; }
.nav-item.active{ color:var(--emerald-600); }
[data-theme="dark"] .nav-item.active{ color:var(--gold-400); }
.nav-item:active{ transform:scale(.9); }

/* টোস্ট */
.toast{
  position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom));
  transform:translate(-50%, 20px);
  background:var(--emerald-900); color:#fff;
  padding:11px 18px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg);
  z-index:200; opacity:0; pointer-events:none;
  transition:all var(--dur-med) var(--ease); max-width:80%; text-align:center;
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

/* অ্যানিমেশন */
.fade-in{ animation:fadeIn var(--dur-med) var(--ease) both; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
</style>
</head>
<body data-theme="light">

<!-- =========================================================
     স্কেলিটন লোডার
     ========================================================= -->
<div class="skeleton-overlay" id="skeletonOverlay">
  <div class="skeleton-shell">
    <div class="sk" style="height:44px; margin-bottom:14px;"></div>
    <div class="sk" style="height:46px; border-radius:999px; margin-bottom:14px;"></div>
    <div style="display:flex; gap:8px; margin-bottom:18px;">
      <div class="sk" style="height:32px; width:70px; border-radius:999px;"></div>
      <div class="sk" style="height:32px; width:70px; border-radius:999px;"></div>
      <div class="sk" style="height:32px; width:70px; border-radius:999px;"></div>
    </div>
    <div class="sk" style="height:76px; margin-bottom:10px;"></div>
    <div class="sk" style="height:76px; margin-bottom:10px;"></div>
    <div class="sk" style="height:76px; margin-bottom:10px;"></div>
    <div class="sk" style="height:76px;"></div>
  </div>
</div>

<!-- =========================================================
     মূল অ্যাপ শেল
     ========================================================= -->
<div class="app-shell" id="appShell" style="display:none;">

  <!-- টপবার -->
  <header class="topbar">

/* =========================================================

const DEMO_MEMBERS = [
  { id:"AS-101", name:"হাফেজ মাওলানা মাহমুদ", role:"admin", classVal:"ফাউন্ডার ব্যাচ", phone:"01711000000", location:"উত্তরা, ঢাকা", status:"active", isOnline:true, joinDate:"০১ জানুয়ারি, ২০২৪", photo:"", fund:{ monthly:2000, deposited:48000, due:0 } },
  { id:"AS-102", name:"মুহাম্মদ তানভীর আহমেদ", role:"moderator", classVal:"কুরআন ব্যাচ", phone:"01822000000", location:"মিরপুর, ঢাকা", status:"active", isOnline:true, joinDate:"১৫ জানুয়ারি, ২০২৪", photo:"", fund:{ monthly:1000, deposited:24000, due:0 } },

];

/* =========================================================
   FIREBASE ইনিশিয়ালাইজেশন
   ========================================================= */
const FirebaseManager = {
  init(){
    try {
      if(!firebase.apps.length){
        firebase.initializeApp(APP_CONFIG.firebase);
      }
      State.firebaseReady = true;
      
      // অথ স্টেট লিসেনার
      firebase.auth().onAuthStateChanged(async (user) => {
        if(user){
          State.user = user;
          // ইউজার রোল ও প্রোফাইল ডাটাবেজ থেকে ফেচ করা
          await this.loadUserProfile(user.uid);
        } else {
          State.user = null;
          State.userProfile = null;
          State.isAdmin = false;
          State.isModerator = false;
        }
        updateAdminControls();
        renderBottomNav();
      });

      this.listenData();
    } catch(e) {
      console.warn("Firebase offline or error, using demo data:", e);
      State.members = DEMO_MEMBERS;
      renderAll();
    }
  },

  async loadUserProfile(uid){
    try {
      const snap = await firebase.database().ref(`users/${uid}`).once('value');
      if(snap.exists()){
        State.userProfile = snap.val();
        State.isAdmin = State.userProfile.role === 'admin';
        State.isModerator = State.userProfile.role === 'moderator' || State.isAdmin;
      }
    } catch(e){
      console.error(e);
    }
  },

  listenData(){
    const db = firebase.database();
    
    // ১. ক্লাসেস লিসেনার
    db.ref('classes').on('value', snap => {
      const val = snap.val();
      if(val){
        State.classes = Array.isArray(val) ? val : Object.values(val);
      } else {
        db.ref('classes').set(State.classes);
      }
      renderClassFilters();
      populateClassSelect();
    });

    // ২. মেম্বারস লিসেনার
    db.ref('members').on('value', snap => {
      const val = snap.val();
      if(val){
        State.members = Object.keys(val).map(key => ({ ...val[key], _key: key }));
      } else {
        // ফায়ারবেস খালি থাকলে ডেমো ডেটা আপলোড করা
        const initialObj = {};
        DEMO_MEMBERS.forEach(m => initialObj[m.id] = m);
        db.ref('members').set(initialObj);
        State.members = DEMO_MEMBERS;
      }
      renderMembersList();
    }, err => {
      console.warn("Database read warning:", err);
      State.members = DEMO_MEMBERS;
      renderMembersList();
    });
  }
};

/* =========================================================
   রেন্ডারিং লজিক (Cards, List, Profiles)
   ========================================================= */
function filterMembers(){
  return State.members.filter(m => {
    // সার্চ ম্যাচ
    const q = State.filter.search.toLowerCase().trim();
    const matchSearch = !q || 
      (m.name && m.name.toLowerCase().includes(q)) ||
      (m.id && m.id.toLowerCase().includes(q)) ||
      (m.classVal && m.classVal.toLowerCase().includes(q)) ||
      (m.location && m.location.toLowerCase().includes(q));

    // স্ট্যাটাস ফিল্টার
    const matchStatus = State.filter.status === 'all' || m.status === State.filter.status;

    // ক্লাস ফিল্টার
    const matchClass = State.filter.classVal === 'all' || m.classVal === State.filter.classVal;

    return matchSearch && matchStatus && matchClass;
  });
}

function renderMembersList(){
  const container = document.getElementById('memberListContainer');
  const filtered = filterMembers();
  
  document.getElementById('memberCountText').textContent = `${t('totalMembers')}: ${filtered.length}`;

  if(filtered.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <p>${t('notFound')}</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(m => {
    const initial = m.name ? m.name.charAt(0) : '?';
    const isOnline = m.isOnline;
    return `
      <div class="member-card fade-in" onclick="openProfileSheet('${m.id}')">
        <div class="avatar-wrap">
          ${m.photo 
            ? `<img src="${m.photo}" class="member-avatar" alt="${m.name}">` 
            : `<div class="member-avatar">${initial}</div>`}
          <span class="status-indicator ${isOnline ? 'online' : 'offline'}" title="${isOnline ? t('online') : t('offline')}"></span>
        </div>
        <div class="member-info">
          <div class="member-name-row">
            <span class="member-name">${m.name}</span>
            ${m.role !== 'member' ? `<span class="role-badge role-${m.role}">${t(m.role)}</span>` : ''}
          </div>
          <div class="member-details-row">
            <span class="member-id">${m.id}</span>
            <span class="member-class">${m.classVal || 'সাধারণ'}</span>
            <span class="member-location">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
              ${m.location}
            </span>
          </div>
        </div>
        <svg class="card-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `;
  }).join('');
}

/* প্রোফাইল শিট ওপেন ও ডাটা ভিউ */
function openProfileSheet(memberId){
  const m = State.members.find(item => item.id === memberId);
  if(!m) return;

  const isSelf = State.user && (State.user.email === m.email || State.user.uid === m.uid);
  const canSeeFinance = isSelf || State.isAdmin || State.isModerator;
  const initial = m.name ? m.name.charAt(0) : '?';

  const sheet = document.getElementById('profileSheetContent');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="profile-card-top">
      ${m.photo 
        ? `<img src="${m.photo}" class="profile-avatar-lg" alt="${m.name}">` 
        : `<div class="profile-avatar-lg">${initial}</div>`}
      <h2 class="profile-name-lg">${m.name}</h2>
      <div class="profile-id-badge">${m.id}</div>
      <div class="profile-status-text">
        <span class="status-indicator ${m.isOnline ? 'online' : 'offline'}" style="position:static; display:inline-block;"></span>
        ${m.isOnline ? t('online') : t('offline')} • ${m.status === 'active' ? t('active') : t('inactive')}
      </div>
    </div>

    <div class="profile-grid">
      <div class="p-field"><div class="p-label">${t('classLabel')}</div><div class="p-val">${m.classVal || '—'}</div></div>
      <div class="p-field"><div class="p-label">${t('role')}</div><div class="p-val">${t(m.role || 'member')}</div></div>
      <div class="p-field"><div class="p-label">${t('location')}</div><div class="p-val">${m.location || '—'}</div></div>
      <div class="p-field"><div class="p-label">${t('joinDate')}</div><div class="p-val">${m.joinDate || '—'}</div></div>
    </div>

    ${canSeeFinance ? `
      <div class="private-fund-box">
        <div class="pf-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          ${t('privateFund')}
        </div>
        <div class="pf-grid">
          <div class="pf-item"><div class="label">${t('monthlyDeposit')}</div><div class="val">৳${m.fund?.monthly || 0}</div></div>
          <div class="pf-item"><div class="label">${t('totalDeposit')}</div><div class="val">৳${m.fund?.deposited || 0}</div></div>
          <div class="pf-item"><div class="label">${t('due')}</div><div class="val" style="color:var(--expense)">৳${m.fund?.due || 0}</div></div>
        </div>
      </div>
    ` : ''}

    <div class="profile-actions">
      <a href="tel:${m.phone}" class="btn gold">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        ${t('call')}
      </a>
      ${(State.isAdmin || State.isModerator) ? `
        <button class="btn outline" onclick="editMember('${m.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          ${t('edit')}
        </button>
      ` : ''}
    </div>
  `;

  document.getElementById('profileSheetBackdrop').classList.add('open');
  document.getElementById('profileSheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProfileSheet(){
  document.getElementById('profileSheetBackdrop').classList.remove('open');
  document.getElementById('profileSheet').classList.remove('open');
  document.body.style.overflow = '';
}

/* =========================================================
   ফিল্টার ও ক্লাস চিপস রেন্ডার
   ========================================================= */
function renderClassFilters(){
  const row = document.getElementById('filterChipsRow');
  const baseChips = `
    <button class="filter-chip ${State.filter.status==='all'&&State.filter.classVal==='all'?'active':''}" data-filter-type="status" data-filter-val="all">${t('all')}</button>
    <button class="filter-chip ${State.filter.status==='active'?'active':''}" data-filter-type="status" data-filter-val="active">${t('active')}</button>
    <button class="filter-chip ${State.filter.status==='inactive'?'active':''}" data-filter-type="status" data-filter-val="inactive">${t('inactive')}</button>
  `;
  const classChips = State.classes.map(c => `
    <button class="filter-chip ${State.filter.classVal===c?'active':''}" data-filter-type="class" data-filter-val="${c}">${c}</button>
  `).join('');

  row.innerHTML = baseChips + classChips;
}

function populateClassSelect(){
  const sel = document.getElementById('mClass');
  if(!sel) return;
  sel.innerHTML = State.classes.map(c => `<option value="${c}">${c}</option>`).join('');
}

/* =========================================================
   অ্যাডমিন মেম্বার অপারেশন (Add, Edit, Save)
   ========================================================= */
function updateAdminControls(){
  const hasAdminRights = State.isAdmin || State.isModerator;
  document.getElementById('fabAddMember').style.display = hasAdminRights ? 'flex' : 'none';
  document.getElementById('btnManageClass').style.display = State.isAdmin ? 'flex' : 'none';
}

function openMemberModal(isEdit = false, member = null){
  document.getElementById('memberForm').reset();
  document.getElementById('memberFormTitle').textContent = isEdit ? 'সদস্য তথ্য সম্পাদনা' : 'নতুন সদস্য নিবন্ধন';
  populateClassSelect();

  if(isEdit && member){
    document.getElementById('formMemberKey').value = member._key || member.id;
    document.getElementById('mName').value = member.name || '';
    document.getElementById('mId').value = member.id || '';
    document.getElementById('mClass').value = member.classVal || State.classes[0];
    document.getElementById('mPhone').value = member.phone || '';
    document.getElementById('mRole').value = member.role || 'member';
    document.getElementById('mLocation').value = member.location || '';
    document.getElementById('mStatus').value = member.status || 'active';
    document.getElementById('mPhoto').value = member.photo || '';
    document.getElementById('mJoinDate').value = member.rawJoinDate || '';
  } else {
    document.getElementById('formMemberKey').value = '';
    document.getElementById('mId').value = 'AS-' + Math.floor(100 + Math.random() * 900);
  }

  document.getElementById('memberFormModal').classList.add('open');
}

function closeMemberModal(){
  document.getElementById('memberFormModal').classList.remove('open');
}

function editMember(id){
  closeProfileSheet();
  const m = State.members.find(item => item.id === id);
  if(m) openMemberModal(true, m);
}

/* মেম্বার ফর্ম সাবমিট */
document.getElementById('memberForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const key = document.getElementById('formMemberKey').value;
  const memberData = {
    name: document.getElementById('mName').value.trim(),
    id: document.getElementById('mId').value.trim(),
    classVal: document.getElementById('mClass').value,
    phone: document.getElementById('mPhone').value.trim(),
    role: document.getElementById('mRole').value,
    location: document.getElementById('mLocation').value.trim(),
    status: document.getElementById('mStatus').value,
    photo: document.getElementById('mPhoto').value.trim(),
    joinDate: document.getElementById('mJoinDate').value || new Date().toLocaleDateString('bn-BD'),
    rawJoinDate: document.getElementById('mJoinDate').value,
    isOnline: false,
    fund: { monthly: 1000, deposited: 0, due: 0 }
  };

  if(State.firebaseReady && firebase.database()){
    const ref = firebase.database().ref('members');
    if(key && key !== memberData.id){
      await ref.child(key).update(memberData);
    } else {
      await ref.child(memberData.id).set(memberData);
    }
  } else {
    // অফলাইন ডেমো পুশ
    const idx = State.members.findIndex(m => m.id === memberData.id);
    if(idx > -1) State.members[idx] = memberData;
    else State.members.unshift(memberData);
    renderMembersList();
  }

  closeMemberModal();
  showToast("সদস্য তথ্য সফলভাবে সংরক্ষিত হয়েছে!");
});

/* =========================================================
   ক্লাস ম্যানেজমেন্ট লজিক
   ========================================================= */
function openClassModal(){
  renderClassListItems();
  document.getElementById('classModal').classList.add('open');
}
function closeClassModal(){
  document.getElementById('classModal').classList.remove('open');
}
function renderClassListItems(){
  const container = document.getElementById('classListContainer');
  container.innerHTML = State.classes.map((c, idx) => `
    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); padding:6px 12px; border-radius:var(--r-sm);">
      <span style="font-size:13px; font-weight:600;">${c}</span>
      <button onclick="deleteClass(${idx})" style="color:var(--expense); font-size:18px;">&times;</button>
    </div>
  `).join('');
}
function deleteClass(idx){
  State.classes.splice(idx, 1);
  syncClasses();
}
document.getElementById('btnAddClassBtn').addEventListener('click', () => {
  const val = document.getElementById('newClassName').value.trim();
  if(!val) return;
  State.classes.push(val);
  document.getElementById('newClassName').value = '';
  syncClasses();
});
async function syncClasses(){
  if(State.firebaseReady && firebase.database()){
    await firebase.database().ref('classes').set(State.classes);
  }
  renderClassFilters();
  renderClassListItems();
  populateClassSelect();
}

/* =========================================================
   থিম ও বটম নেভিগেশন
   ========================================================= */
const NavIcons = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  fund:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1 3 2.3c0 3-6 1.5-6 4.5 0 1.4 1.3 2.5 3 2.5s3-1 3-2.3"/></svg>',
  members:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  chat:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  admin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  moderator:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  more:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>'
};

function renderBottomNav(){
  const items = [
    { key:'home', href:'index.html', label:'home' },
    { key:'fund', href:'found.html', label:'fund' },
    { key:'members', href:'members.html', label:'members', active:true },
    { key:'chat', href:'chat.html', label:'chat' }
  ];
  if(State.isAdmin) items.push({ key:'admin', href:'admin-moderator.html', label:'admin' });
  else if(State.isModerator) items.push({ key:'moderator', href:'admin-moderator.html', label:'moderator' });
  items.push({ key:'more', href:'index.html', label:'more' });

  const inner = document.getElementById('bottomNavInner');
  inner.innerHTML = items.map(it => `
    <a href="${it.href}" class="nav-item ${it.active ? 'active':''}" aria-label="${t(it.label)}">
      <span>${NavIcons[it.key]}</span>
      <span>${t(it.label)}</span>
    </a>
  `).join('');
  document.getElementById('bottomNav').style.display = 'flex';
}

function applyTheme(){
  let choice = State.theme;
  if(choice === 'system'){
    choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.body.setAttribute('data-theme', choice);
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 2600);
}

/* =========================================================
   ইভেন্ট বাইন্ডিং ও ইনিট
   ========================================================= */
function bindEvents(){
  // সার্চ ইনপুট
  const searchInput = document.getElementById('memberSearchInput');
  const searchClear = document.getElementById('searchClearBtn');
  searchInput.addEventListener('input', (e) => {
    State.filter.search = e.target.value;
    searchClear.style.display = e.target.value ? 'block' : 'none';
    renderMembersList();
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    State.filter.search = '';
    searchClear.style.display = 'none';
    renderMembersList();
  });

  // ফিল্টার চিপস ক্লিক
  document.getElementById('filterChipsRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    const type = chip.dataset.filterType;
    const val = chip.dataset.filterVal;

    if(type === 'status'){
      State.filter.status = val;
      State.filter.classVal = 'all';
    } else if(type === 'class'){
      State.filter.classVal = val;
      State.filter.status = 'all';
    }
    renderClassFilters();
    renderMembersList();
  });

  // শিট ও মডাল ব্যাকড্রপ ক্লোজ
  document.getElementById('profileSheetBackdrop').addEventListener('click', closeProfileSheet);
  document.getElementById('closeMemberModal').addEventListener('click', closeMemberModal);
  document.getElementById('btnCancelMemberModal').addEventListener('click', closeMemberModal);
  document.getElementById('fabAddMember').addEventListener('click', () => openMemberModal(false));
  document.getElementById('btnManageClass').addEventListener('click', openClassModal);
  document.getElementById('closeClassModal').addEventListener('click', closeClassModal);
}

function renderAll(){
  applyTheme();
  document.documentElement.dir = State.lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = State.lang;
  renderClassFilters();
  renderMembersList();
  renderBottomNav();
  updateAdminControls();
}

async function init(){
  applyTheme();
  bindEvents();
  FirebaseManager.init();

  // প্রাথমিক রেন্ডার
  renderAll();

  // স্কেলিটন লোডার হাইড
  setTimeout(() => {
    const sk = document.getElementById('skeletonOverlay');
    const app = document.getElementById('appShell');
    sk.style.opacity = '0';
    sk.style.transition = 'opacity .35s ease';
    app.style.display = 'block';
    setTimeout(() => sk.style.display = 'none', 350);
  }, 400);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
